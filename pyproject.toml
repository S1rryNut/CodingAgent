[project]
name = "coding-agent"
version = "0.1.0"
description = "基于自研 ReAct 框架的 AI 编程助手，支持 TDD 循环"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "tenacity>=8.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
